[package]
name = "bilibili-live-bridge"
version = "0.1.0"
edition = "2024"
authors = ["Marvine <15258427350@163.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt","rt-multi-thread" , "net", "time", "io-util"] }

hmac = "0.13.0"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.26.1", features = ["v4"] }