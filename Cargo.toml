[workspace]
members = ["crates/bridge-core", "crates/bridge-native", "crates/bridge-worker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Marvine <15258427350@163.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bridge-core = { path = "crates/bridge-core" }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

hmac = "0.13.0"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
uuid = { version = "1.26.1", features = ["v4"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
